<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mods</title>
  <meta name="description" content="Fabric mods for Minecraft.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div class="bg" aria-hidden="true"></div>

  <header class="nav-wrap">
    <div class="nav wrap">
      <a href="./" class="brand"><span class="brand-mark"></span><span id="brand">Mods</span></a>
      <nav id="site-links" class="nav-links" aria-label="Elsewhere"></nav>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <span class="pill" id="pill"><span class="dot"></span><span id="pill-text"></span></span>
      <h1 class="gradient-text" id="tagline">Mods</h1>
      <p class="lead" id="intro"></p>
      <div class="hero-actions">
        <a href="#mods" class="btn btn-primary">Browse mods</a>
        <a href="#" id="hero-github" class="btn btn-glass" hidden>GitHub</a>
      </div>
    </section>

    <section id="mods" class="wrap mods-section" aria-labelledby="mods-title">
      <div class="section-head">
        <h2 id="mods-title">All mods <span class="count" id="count"></span></h2>
        <label class="search">
          <span class="visually-hidden">Search mods</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search mods" autocomplete="off">
        </label>
      </div>

      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>No mods match “<span id="empty-term"></span>”. <button type="button" id="clear" class="text-btn">Clear search</button></p>
    </section>
  </main>

  <footer class="wrap site-footer" id="footer"></footer>

  <script src="mods.js"></script>
  <script src="app.js"></script>
</body>
</html>
